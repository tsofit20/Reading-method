<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעור 1 - מילים ומשפטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F2E9;
    --surface: #FFFFFF;
    --border: #D8D2C4;
    --text: #111111;
    --text-muted: #8A8474;
    --success: #2F7D5A;
    --success-bg: #E5F3EB;
    --danger: #B54B3D;
    --danger-bg: #FBEAE6;
    --card-bg: #5EC1CE;
    --card-bg-active: #2E9BAA;
    --card-border: #3E9DB0;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height:100vh;
    padding: 0;
  }
  .wrap{ max-width: 700px; width:100%; margin:0 auto; min-height:100vh; padding: 2.5rem 1.5rem 3rem; }
  h1{ font-size: 20px; text-align:center; margin: 0 0 1.5rem; font-weight:700; }
  button{
    font-family:inherit;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor:pointer;
    padding: 10px 18px;
    font-size:15px;
  }
  button:hover{ background: #f3efe4; }
  button:disabled{ opacity:0.5; cursor:default; }
  .btn-accent{ border: 2px solid var(--card-border); color: var(--text); font-weight:600; }
  #progress{ display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:1.5rem; flex-wrap:wrap; }
  .prog-dot{ width:10px; height:10px; border-radius:50%; background: var(--border); }
  .prog-dot.active{ background: var(--card-bg-active); }
  .prog-dot.done{ background: var(--success); }
  .prog-label{ font-size:13px; color: var(--text-muted); }
  .prog-label.active{ color: var(--text); font-weight:500; }
  .prog-sep{ width:20px; height:1px; background: var(--border); }
  #stage-label{ text-align:center; font-size:14px; color: var(--text-muted); margin-bottom:1.5rem; }
  #app{ text-align:center; }
  .grid-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; padding:1.5rem 0.5rem; }
  .shuffle-stage{ position:relative; height:220px; max-width:640px; margin:0 auto 1rem; }
  .shuffle-card{ position:absolute; font-size:30px; padding:1.1rem 1.7rem; background: var(--card-bg); color: var(--text); border:1px solid var(--card-border); border-radius:12px; white-space:nowrap; will-change: transform; }
  .grid-row{ display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
  .card-slot{ position:relative; }
  .pointer{ position:absolute; top:-32px; left:50%; transform:translateX(-50%); font-size:22px; color: var(--card-bg-active); animation: bouncePoint 0.9s ease-in-out infinite; }
  @keyframes bouncePoint { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(6px);} }
  @keyframes shakeX { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  @keyframes shufflePulse{ 0%{ transform:scale(0.8) rotate(-6deg); opacity:0.6;} 50%{ transform:scale(1.08) rotate(5deg); opacity:1;} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  .shuffle-pulse{ animation: shufflePulse 0.16s ease-out; }
  .card{
    font-size:30px; padding:1.1rem 1.7rem; background: var(--card-bg); color: var(--text);
    border:1px solid var(--card-border); border-radius:12px; transition: all 0.2s; cursor:pointer;
  }
  .card.active{ background: var(--card-bg-active); transform:scale(1.1); }
  .card.correct{ background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .card.wrong{ background: var(--danger-bg); color: var(--danger); animation: shakeX 0.3s; }
  .card.known{ background: var(--success-bg); color: var(--success); border-color: var(--success); opacity:0.85; }
  .listen-status{
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    font-size:13px; color: var(--card-bg-active); white-space:nowrap; font-weight:500;
  }
  .bloom-smiley{
    position:absolute; top:-38px; left:50%; transform:translateX(-50%) scale(0.3);
    font-size:32px; opacity:0; pointer-events:none;
    animation: bloomFade 2s ease-out forwards;
  }
  @keyframes bloomFade{
    0%{ transform:translateX(-50%) scale(0.3); opacity:0; }
    20%{ transform:translateX(-50%) scale(1.3); opacity:1; }
    35%{ transform:translateX(-50%) scale(1); opacity:1; }
    100%{ transform:translateX(-50%) scale(1); opacity:0; }
  }
  .card:disabled{ cursor:default; }
  .word-count{ margin-top:1rem; font-size:13px; color: var(--text-muted); }
  .feedback{ text-align:center; margin-top:0.5rem; font-size:15px; min-height:24px; }
  .feedback.correct{ color: var(--success); }
  .feedback.wrong{ color: var(--danger); }
  .slots-row{ display:flex; justify-content:center; gap:10px; min-height:70px; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:1rem; }
  .slot-filled{ font-size:26px; padding:10px 20px; background:#fff; border:1px solid var(--border); border-radius:8px; }
  .slot-empty{ width:80px; height:52px; border:1px dashed #C7C0AF; border-radius:8px; }
  .bank-row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:1rem; }
  .bank-btn{ font-size:26px; padding:12px 22px; background: var(--card-bg); color: var(--text); border:1px solid var(--card-border); border-radius:12px; }
  .settings-toggle{ text-align:left; margin-bottom:0.5rem; }
  #settingsPanel{ display:none; background:#fff; border-radius:12px; padding:1rem; margin-bottom:1.5rem; border:1px solid var(--border); }
  #settingsPanel input[type=text]{ flex:1; font-size:13px; font-family:inherit; border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>שיעור 1 - מילים ומשפטים</h1>
  <div class="settings-toggle">
    <button id="settingsToggle">⚙ הגדרות הקלטות</button>
  </div>
  <div id="settingsPanel"></div>
  <div id="progress"></div>
  <div id="stage-label"></div>
  <div id="app"></div>
</div>

<script>
const CARD_BG = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim();

const words = [
  {id:'aba', text:'אַבָּא'},
  {id:'ima', text:'אִמָּא'},
  {id:'yosi', text:'יוֹסִי'},
  {id:'shel', text:'שֶׁל'},
  {id:'bait', text:'בַּיִת'},
  {id:'gina', text:'גִּנָּה'},
  {id:'rami', text:'רָמִי'}
];

const sentences = [
  {key:'sent1', ids:['rami','shel','aba']},
  {key:'sent2', ids:['gina','shel','yosi']},
  {key:'sent3', ids:['bait','shel','rami']}
];

const AUDIO_MANIFEST = [
  {key:'word_aba', label:'המילה: אַבָּא'},
  {key:'word_ima', label:'המילה: אִמָּא'},
  {key:'word_bait', label:'המילה: בַּיִת'},
  {key:'word_yosi', label:'המילה: יוֹסִי'},
  {key:'word_shel', label:'המילה: שֶׁל'},
  {key:'word_gina', label:'המילה: גִּנָּה'},
  {key:'word_rami', label:'המילה: רָמִי'},
  {key:'msg_instr_check', label:'הוראת פתיחה: "אילו מילים אתה כבר מכיר? לחץ על כל מילה שאתה יודע לקרוא, ותקרא אותה בקול"'},
  {key:'msg_all_known', label:'עידוד: "כל הכבוד! אתה מכיר את כל המילים, אפשר לעבור הלאה"'},
  {key:'prompt_eifo', label:'"איפה" (משמש לפני כל מילה בשלב ב)'},
  {key:'msg_instr_stageB', label:'הוראה בתחילת שלב ב: "עכשיו תלחצו על המילה שאני אומר"'},
  {key:'msg_stageB_done', label:'עידוד בסיום שלב ב: "כל הכבוד! זיהית את כל המילים"'},
  {key:'msg_instr_stageC', label:'הוראה בתחילת שלב ג: "עכשיו תרכיבו את המשפט לבד"'},
  {key:'prompt_repeat', label:'"תחזרו אחריי בקול" (בתוך הרכבת כל משפט)'},
  {key:'msg_all_done', label:'עידוד בסיום שלב ג: "סיימת את כל שלושת המשפטים בהצלחה!"'},
  {key:'sent1', label:'המשפט: רָמִי שֶׁל אַבָּא'},
  {key:'sent2', label:'המשפט: גִּנָּה שֶׁל יוֹסִי'},
  {key:'sent3', label:'המשפט: בַּיִת שֶׁל רָמִי'}
];

let audioUrls = {};
let stage = 0;
let stageBGridOrder = null;
let knownWords = new Set();
let presentIndex = 0;
let askedOrder = [];
let askIndex = 0;
let built = [];
let sentIndex = 0;
let voices = [];
let chosenVoice = null;
let actx = null;
let currentAudioEl = null;

function getCtx(){
  if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(actx.state === 'suspended'){ actx.resume(); }
  return actx;
}

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function stripNiqud(t){ return t.replace(/[\u0591-\u05C7]/g,'').trim(); }
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function playReadySound(){
  const ctx = getCtx(); const now = ctx.currentTime;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='sine'; osc.frequency.value=660;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.15, now+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now+0.2);
}
function createWordRecognizer(targetText){
  if(!SpeechRecognitionCtor) return null;
  let rec;
  try{
    rec = new SpeechRecognitionCtor();
    rec.lang = 'he-IL';
    rec.continuous = true;
    rec.interimResults = false;
    rec.maxAlternatives = 3;
  }catch(e){ return null; }
  const pieces = [];
  let resolved = false;
  let resolveFn;
  const donePromise = new Promise(resolve=>{ resolveFn = resolve; });
  let readyResolved = false;
  let readyResolveFn;
  const readyPromise = new Promise(resolve=>{ readyResolveFn = resolve; });
  const readyFallback = setTimeout(()=>{ if(!readyResolved){ readyResolved=true; readyResolveFn(false); } }, 1500);

  rec.onstart = ()=>{ if(!readyResolved){ readyResolved=true; clearTimeout(readyFallback); readyResolveFn(true); } };
  rec.onresult = (e)=>{
    for(let i=e.resultIndex; i<e.results.length; i++){
      if(e.results[i].isFinal){ pieces.push(e.results[i][0].transcript); }
    }
  };
  rec.onerror = ()=>{};
  rec.onend = ()=>{
    if(resolved) return;
    resolved = true;
    const heard = pieces.join(' ');
    const targetClean = stripNiqud(targetText).replace(/\s+/g,'');
    const heardClean = stripNiqud(heard).replace(/\s+/g,'');
    let match = false;
    if(heardClean){
      match = heardClean.includes(targetClean) || targetClean.includes(heardClean) || levenshtein(heardClean, targetClean) <= 1;
    }
    resolveFn(pieces.length ? match : null);
  };
  try{ rec.start(); }catch(e){ resolveFn(null); if(!readyResolved){ readyResolved=true; clearTimeout(readyFallback); readyResolveFn(false); } }

  return { stop: ()=>{ try{ rec.stop(); }catch(e){} }, donePromise, readyPromise };
}
function stopAllAudio(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(currentAudioEl){ try{ currentAudioEl.pause(); }catch(e){} currentAudioEl = null; }
}
function playCorrectSound(){
  const ctx = getCtx(); const now = ctx.currentTime;
  [523.25, 783.99].forEach((freq, i)=>{
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001, now+i*0.11);
    gain.gain.exponentialRampToValueAtTime(0.25, now+i*0.11+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+i*0.11+0.28);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now+i*0.11); osc.stop(now+i*0.11+0.3);
  });
}
function playWrongSound(){
  const ctx = getCtx(); const now = ctx.currentTime;
  [196, 146.83].forEach((freq, i)=>{
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='square'; osc.frequency.value=freq;
    const start = now+i*0.16;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.35, start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start+0.32);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start); osc.stop(start+0.34);
  });
}
function playVictorySound(){
  const ctx = getCtx(); const now = ctx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    const start=now+i*0.1;
    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(0.28,start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start); osc.stop(start+0.42);
  });
  const chordStart = now+4*0.1+0.05;
  [783.99,1046.5,1318.5].forEach(freq=>{
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001,chordStart);
    gain.gain.exponentialRampToValueAtTime(0.22,chordStart+0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001,chordStart+0.6);
    osc.connect(gain).connect(ctx.destination);
    osc.start(chordStart); osc.stop(chordStart+0.62);
  });
}

function loadVoices(){
  voices = speechSynthesis.getVoices();
  chosenVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he')) || null;
}
loadVoices();
if(typeof speechSynthesis !== 'undefined'){ speechSynthesis.onvoiceschanged = loadVoices; }

function speakFallback(text, opts, onend){
  stopAllAudio();
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL';
    u.rate = (opts && opts.rate) || 0.78;
    u.pitch = (opts && opts.pitch) || 1.05;
    if(chosenVoice) u.voice = chosenVoice;
    if(onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ if(onend) onend(); }
}
function playKey(key, fallbackText, opts, onend){
  stopAllAudio();
  const url = audioUrls[key];
  if(url){
    const audio = new Audio(url);
    currentAudioEl = audio;
    audio.onended = ()=>{ if(currentAudioEl===audio) currentAudioEl=null; if(onend) onend(); };
    audio.onerror = ()=> speakFallback(fallbackText, opts, onend);
    audio.play().catch(()=> speakFallback(fallbackText, opts, onend));
  } else {
    speakFallback(fallbackText, opts, onend);
  }
}
function playSequence(items, idx, onallend){
  if(idx >= items.length){ if(onallend) onallend(); return; }
  const it = items[idx];
  playKey(it.key, it.text, it.opts, ()=> playSequence(items, idx+1, onallend));
}
function wordText(id){ return words.find(w=>w.id===id).text; }

function loadAudioUrls(){
  try{
    const raw = localStorage.getItem('lesson1-audio-urls');
    if(raw){ audioUrls = JSON.parse(raw); }
  }catch(e){ audioUrls = {}; }
  renderSettingsPanel();
}
function saveAudioUrls(){
  try{ localStorage.setItem('lesson1-audio-urls', JSON.stringify(audioUrls)); }catch(e){}
}
function renderSettingsPanel(){
  const panel = document.getElementById('settingsPanel');
  panel.innerHTML = `
    <div style="font-size:13px; color:var(--text-muted); margin-bottom:0.75rem;">הדביקו כאן קישור ציבורי (לדוגמה מ-Google Drive) לכל הקלטה. עד שיוזן קישור, תישמע השמעה זמנית בקול מחשב. הקישורים נשמרים בדפדפן הזה בלבד.</div>
    ${AUDIO_MANIFEST.map(m=>`
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <span style="font-size:13px; width:280px; flex-shrink:0;">${m.label}</span>
        <input type="text" data-key="${m.key}" value="${audioUrls[m.key] ? audioUrls[m.key].replace(/"/g,'&quot;') : ''}" placeholder="קישור לקובץ האודיו" />
      </div>
    `).join('')}
    <button id="saveAudio" class="btn-accent">שמירת קישורים</button>
    <span id="savedMsg" style="font-size:13px; color:var(--success); margin-right:10px;"></span>
  `;
  document.getElementById('saveAudio').onclick = ()=>{
    panel.querySelectorAll('input[data-key]').forEach(inp=>{
      audioUrls[inp.dataset.key] = inp.value.trim();
    });
    saveAudioUrls();
    document.getElementById('savedMsg').textContent = 'נשמר';
    setTimeout(()=>{ const m=document.getElementById('savedMsg'); if(m) m.textContent=''; }, 2000);
  };
}
document.getElementById('settingsToggle').onclick = ()=>{
  const panel = document.getElementById('settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
};

function renderProgress(){
  const prog = document.getElementById('progress');
  const labels = ['הצגה','זיהוי','משפטים'];
  prog.innerHTML = labels.map((l,i)=>{
    const active = i===stage;
    const done = i<stage;
    return `<div style="display:flex; align-items:center; gap:6px;">
      <div class="prog-dot ${done?'done':(active?'active':'')}"></div>
      <span class="prog-label ${active?'active':''}">${l}</span>
    </div>` + (i<labels.length-1 ? `<div class="prog-sep"></div>` : '');
  }).join('');
  document.getElementById('stage-label').textContent =
    stage===0 ? 'שלב א - אילו מילים אתה מכיר?' :
    stage===1 ? 'שלב ב - איפה המילה?' :
    'שלב ג - הרכבת משפטים';
}

function straightGrid(activeId, disabledIds, orderedList, knownSet){
  const list = orderedList || words;
  const row1 = list.slice(0,4);
  const row2 = list.slice(4);
  function card(w){
    const isActive = w.id === activeId;
    const isDisabled = disabledIds && disabledIds.includes(w.id);
    const isKnown = knownSet && knownSet.has(w.id);
    return `<div class="card-slot" id="slot-${w.id}">
      ${isActive ? `<div class="pointer">▼</div>` : ''}
      <button data-id="${w.id}" class="card ${isActive?'active':''} ${isKnown?'known':''}" ${isDisabled?'disabled':''}>${w.text}</button>
    </div>`;
  }
  return `<div class="grid-wrap">
    <div class="grid-row">${row1.map(card).join('')}</div>
    <div class="grid-row">${row2.map(card).join('')}</div>
  </div>`;
}

function showBloom(slot, emoji){
  const smiley = document.createElement('div');
  smiley.className = 'bloom-smiley';
  smiley.textContent = emoji;
  slot.appendChild(smiley);
  setTimeout(()=>{ smiley.remove(); }, 2000);
}

function renderStageCheck(){
  const app = document.getElementById('app');
  const known = knownWords;
  app.innerHTML = `
    <div style="font-size:17px; margin-bottom:1rem;">האם יש מילים שאתה זוכר ומצליח לקרוא לבד?</div>
    <div id="checkGrid">${straightGrid(null, null, words, known)}</div>
    <div class="word-count" id="knownCount">${known.size} מתוך ${words.length} מילים ידועות</div>
    <div style="margin-top:1rem;">
      <button id="continueBtn" class="btn-accent">המשך</button>
    </div>
  `;
  document.querySelectorAll('#checkGrid button[data-id]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      if(known.has(id) || btn.disabled || btn.dataset.busy) return;
      const wText = wordText(id);
      const slot = document.getElementById('slot-'+id);

      if(!SpeechRecognitionCtor){
        // no mic support in this browser - fall back to trusting the click
        known.add(id);
        btn.classList.add('known');
        playVictorySound();
        showBloom(slot, '😄');
        document.getElementById('knownCount').textContent = `${known.size} מתוך ${words.length} מילים ידועות`;
        return;
      }

      btn.dataset.busy = '1';
      const statusEl = document.createElement('div');
      statusEl.className = 'listen-status';
      statusEl.textContent = 'מכינים...';
      slot.appendChild(statusEl);

      const recognizer = createWordRecognizer(wText);
      if(recognizer){ await recognizer.readyPromise; playReadySound(); }
      statusEl.textContent = '🎙 מקשיבים...';

      await new Promise(res=> setTimeout(res, 2200));
      let match = null;
      if(recognizer){ recognizer.stop(); match = await recognizer.donePromise; }
      statusEl.remove();
      delete btn.dataset.busy;

      if(match === true){
        known.add(id);
        btn.classList.add('known');
        playVictorySound();
        showBloom(slot, '😄');
      } else if(match === false){
        btn.classList.add('wrong');
        setTimeout(()=> btn.classList.remove('wrong'), 350);
        showBloom(slot, '🤔');
      } else {
        // no speech detected / recognizer unavailable mid-flow - trust the click gently
        known.add(id);
        btn.classList.add('known');
        playCorrectSound();
        showBloom(slot, '🙂');
      }
      document.getElementById('knownCount').textContent = `${known.size} מתוך ${words.length} מילים ידועות`;
    };
  });
  document.getElementById('continueBtn').onclick = async ()=>{
    if(known.size === words.length){
      playKey('msg_all_known', 'כל הכבוד! אתה מכיר את כל המילים, אפשר לעבור הלאה', {}, ()=>{
        goToLesson2WithSentences();
      });
    } else {
      const unknown = words.filter(w=> !known.has(w.id));
      await readUnknownWithArrows(unknown);
      stage = 1;
      askedOrder = words.map(w=>w.id).sort(()=>Math.random()-0.5);
      askIndex = 0;
      stageBGridOrder = null;
      renderProgress();
      renderStageB();
    }
  };
  playKey('msg_instr_check', 'האם יש מילים שאתה זוכר ומצליח לקרוא לבד?');
}

function readUnknownWithArrows(unknownList){
  return new Promise(resolveAll=>{
    let i = 0;
    function next(){
      if(i >= unknownList.length){ resolveAll(); return; }
      const w = unknownList[i];
      const slot = document.getElementById('slot-'+w.id);
      const arrow = document.createElement('div');
      arrow.className = 'pointer';
      arrow.textContent = '▼';
      slot.appendChild(arrow);
      playKey('word_'+w.id, w.text, {}, ()=>{
        arrow.remove();
        i++;
        setTimeout(next, 250);
      });
    }
    next();
  });
}

function goToLesson2WithSentences(){
  try{
    localStorage.setItem('handoff-sentences', JSON.stringify(sentences.map(s=>s.ids)));
  }catch(e){}
  window.location.href = 'index.html';
}

function renderStageB(){
  const app = document.getElementById('app');
  if(askIndex >= askedOrder.length){
    app.innerHTML = `
      <div style="font-size:20px; margin-bottom:1.5rem;">✓ כל הכבוד! זיהית את כל המילים</div>
      <button id="toC" class="btn-accent">להמשך לשלב הרכבת משפטים</button>`;
    document.getElementById('toC').onclick = ()=>{ stage=2; sentIndex=0; built=[]; renderProgress(); renderStageC(); };
    playKey('msg_stageB_done', 'כל הכבוד! זיהית את כל המילים');
    return;
  }
  const target = askedOrder[askIndex];
  const isFirstQuestion = !stageBGridOrder;
  if(!stageBGridOrder){ stageBGridOrder = [...words].sort(()=>Math.random()-0.5); }
  const gridOrder = stageBGridOrder;
  app.innerHTML = `
    <div style="margin-bottom:1rem;">
      <div style="font-size:20px;">הקשיבו ולחצו על המילה הנכונה</div>
      <button id="playAsk" style="margin-top:8px; padding:6px 14px; font-size:14px;" ${isFirstQuestion?'disabled':''}>🔊 שמעו שוב</button>
    </div>
    <div id="cardsWrap">${isFirstQuestion ? '' : straightGrid(null)}</div>
    <div id="fb" class="feedback"></div>
  `;

  function askQuestion(){
    playSequence([
      {key:'prompt_eifo', text:'איפה'},
      {key:'word_'+target, text: wordText(target)}
    ], 0);
  }

  function settleFinalGrid(){
    const cardsWrap = document.getElementById('cardsWrap');
    cardsWrap.innerHTML = straightGrid(null, null, gridOrder);
    document.querySelectorAll('#cardsWrap button[data-id]').forEach(btn=>{
      btn.onclick = ()=>{
        const fb = document.getElementById('fb');
        if(btn.dataset.id === target){
          playCorrectSound();
          btn.classList.add('correct');
          fb.textContent = 'נכון!'; fb.className = 'feedback correct';
          document.querySelectorAll('#cardsWrap button').forEach(b=>b.disabled=true);
          setTimeout(()=>{ askIndex++; renderStageB(); }, 700);
        } else {
          playWrongSound();
          btn.classList.add('wrong');
          fb.textContent = 'לא בדיוק, נסו שוב'; fb.className = 'feedback wrong';
          setTimeout(()=>{ btn.classList.remove('wrong'); }, 350);
        }
      };
    });
    const playAskBtn = document.getElementById('playAsk');
    playAskBtn.disabled = false;
    playAskBtn.onclick = askQuestion;
    askQuestion();
  }

  if(isFirstQuestion){
    runShuffleAnimation(gridOrder, settleFinalGrid);
  } else {
    settleFinalGrid();
  }
}

function runShuffleAnimation(finalOrder, onDone){
  const cardsWrap = document.getElementById('cardsWrap');
  const positions = [
    {x:10, y:0}, {x:170, y:0}, {x:330, y:0}, {x:490, y:0},   // row 1 (4 cards)
    {x:90, y:112}, {x:250, y:112}, {x:410, y:112}             // row 2 (3 cards)
  ];

  let styleEl = document.getElementById('flyKeyframes');
  if(!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'flyKeyframes'; document.head.appendChild(styleEl); }

  let cssRules = '';
  const cardsHtml = finalOrder.map((w, i)=>{
    const pos = positions[i];
    const rand = ()=> (Math.random()*2-1);
    const wp = [0,1,2].map(()=>({ x: rand()*230, y: rand()*150, r: rand()*55 }));
    const animName = `fly_${w.id}_${i}`;
    cssRules += `@keyframes ${animName} {
      0% { transform: translate(${wp[0].x}px, ${wp[0].y}px) rotate(${wp[0].r}deg); opacity:0.5; }
      28% { transform: translate(${wp[1].x}px, ${wp[1].y}px) rotate(${wp[1].r}deg); opacity:1; }
      60% { transform: translate(${wp[2].x}px, ${wp[2].y}px) rotate(${wp[2].r}deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }`;
    return `<div class="shuffle-card" style="left:${pos.x}px; top:${pos.y}px; animation: ${animName} 5s cubic-bezier(0.22,0.61,0.36,1) forwards;">${w.text}</div>`;
  }).join('');

  styleEl.textContent = cssRules;
  cardsWrap.innerHTML = `<div class="shuffle-stage">${cardsHtml}</div>`;
  setTimeout(onDone, 5000);
}

function renderStageC(){
  const app = document.getElementById('app');
  if(sentIndex >= sentences.length){
    app.innerHTML = `
      <div style="font-size:20px; margin-bottom:1rem;">✓ סיימת את כל שלושת המשפטים בהצלחה!</div>
      <div style="font-size:15px; color:var(--text-muted); margin-bottom:1.5rem;">עכשיו נכתוב את אותם המשפטים במחברת</div>
      <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
        <button id="toWriting" class="btn-accent">להמשך לכתיבה במחברת</button>
        <button id="restart">התחל שיעור מחדש</button>
      </div>`;
    document.getElementById('toWriting').onclick = ()=> goToLesson2WithSentences();
    document.getElementById('restart').onclick = ()=>{ stage=0; presentIndex=0; sentIndex=0; built=[]; knownWords=new Set(); stageBGridOrder=null; renderProgress(); renderStageCheck(); };
    playKey('msg_all_done', 'סיימת את כל שלושת המשפטים בהצלחה');
    return;
  }
  const sentObj = sentences[sentIndex];
  const sent = sentObj.ids;
  const bank = words.map(w=>w.id).sort(()=>Math.random()-0.5);
  app.innerHTML = `
    <div style="font-size:13px; color:var(--text-muted); margin-bottom:0.5rem;">משפט ${sentIndex+1} מתוך ${sentences.length}</div>
    <div style="margin-bottom:1rem;">
      <button id="playSentence" style="padding:8px 18px; font-size:15px;">🔊 השמיעו שוב</button>
      <div id="promptText" style="font-size:14px; color:var(--text-muted); margin-top:8px;">הקשיבו למשפט</div>
    </div>
    <div id="slots" class="slots-row"></div>
    <div id="bank" class="bank-row">
      ${bank.map(id=>`<button data-id="${id}" class="bank-btn">${wordText(id)}</button>`).join('')}
    </div>
    <div id="fbC" class="feedback"></div>
  `;
  built = [];
  renderSlots(sent);
  document.getElementById('playSentence').onclick = ()=>runNarration(sentObj);
  document.querySelectorAll('.bank-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const fbC = document.getElementById('fbC');
      const expected = sent[built.length];
      if(btn.dataset.id === expected){
        playCorrectSound();
        built.push(btn.dataset.id);
        btn.style.visibility='hidden';
        renderSlots(sent);
        fbC.textContent = '';
        if(built.length === sent.length){
          fbC.textContent = 'מצוין! המשפט נכון'; fbC.className='feedback correct';
          setTimeout(()=>{ sentIndex++; renderStageC(); }, 1200);
        }
      } else {
        playWrongSound();
        btn.classList.add('wrong');
        fbC.textContent = 'נסו מילה אחרת'; fbC.className='feedback wrong';
        setTimeout(()=>{ btn.classList.remove('wrong'); }, 350);
      }
    };
  });
  if(sentIndex === 0){
    playKey('msg_instr_stageC', 'עכשיו תרכיבו את המשפט לבד', {}, ()=>runNarration(sentObj));
  } else {
    runNarration(sentObj);
  }
}

function runNarration(sentObj){
  const promptEl = document.getElementById('promptText');
  const fullText = sentObj.ids.map(wordText).join(' ');
  if(promptEl) promptEl.textContent = 'הקשיבו למשפט';
  playKey(sentObj.key, fullText, {rate:0.7}, ()=>{
    setTimeout(()=>{
      if(promptEl) promptEl.textContent = 'תחזרו אחריי בקול';
      playKey('prompt_repeat', 'תחזרו אחריי בקול', {rate:0.85}, ()=>{
        setTimeout(()=>{
          if(promptEl) promptEl.textContent = 'ועכשיו הרכיבו את המשפט';
          playKey(sentObj.key, fullText, {rate:0.68});
        }, 400);
      });
    }, 500);
  });
}

function renderSlots(sent){
  const slots = document.getElementById('slots');
  slots.innerHTML = built.map(id=>`<div class="slot-filled">${wordText(id)}</div>`).join('') +
    Array.from({length: sent.length - built.length}).map(()=>`<div class="slot-empty"></div>`).join('');
}

loadAudioUrls();
renderProgress();
renderStageCheck();
</script>
